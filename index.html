<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>sync-shift | タイムスケジュール・カレンダー同期</title>
  <!-- スマホ用アプリアイコン & PWA設定 -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <!-- 上段: アプリ名 & Google連携ボタン / 再同期ボタン -->
    <div class="header-top-row">
      <div class="brand-group">
        <img src="assets/images/logo.png" alt="SYNC-SHIFT Logo" class="brand-logo-img">
        <h1 class="app-title">Google Sync Shift</h1>
      </div>

      <div class="header-actions">
        <!-- 再同期（リロード）ボタン -->
        <button class="btn-reload" id="reloadBtn" title="カレンダーを再同期">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="reload-text">再同期</span>
        </button>

        <!-- Google連携ボタン -->
        <button class="btn-auth" id="authBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
          </svg>
          <span id="authBtnText">Google連携</span>
        </button>
      </div>
    </div>

    <!-- 下段（操作バー）: 週送りナビ & 表示カレンダー選択 -->
    <div class="controls">
      <div class="nav-group">
        <button class="btn-icon" id="prevWeekBtn" title="前の週">◀</button>
        <div class="current-week-label" id="weekRangeLabel">読み込み中...</div>
        <button class="btn-icon" id="nextWeekBtn" title="次の週">▶</button>
      </div>

      <!-- 複数カレンダー切り替えボタン & ポップアップ -->
      <div class="calendar-select-wrap">
        <button type="button" class="btn-cal-filter" id="calFilterBtn">
          <span>表示カレンダー</span>
          <span class="cal-count-badge" id="calCountBadge">0</span>
          <span style="font-size:0.65rem;">▼</span>
        </button>
        
        <!-- カレンダー複数選択ドロップダウンメニュー -->
        <div class="cal-dropdown-panel" id="calDropdownPanel">
          <div class="cal-dropdown-header">表示するカレンダーを選択</div>
          <div class="cal-checkbox-list" id="calCheckboxList">
            <!-- JSで動的生成 -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ステータスバー（操作案内） -->
  <div class="status-banner">
    <div class="status-info-left" id="statusMessage">
      <!-- 今後のお知らせや状態案内が入る領域 -->
    </div>
    <div class="status-guide-text">🖱 ドラッグ / 👆 タッチで範囲選択</div>
  </div>

  <!-- カレンダーグリッド -->
  <div class="calendar-container" id="calendarContainer">
    <div class="grid-header" id="gridHeader">
      <div class="header-cell time-corner">時刻</div>
      <!-- 7日分のヘッダーがJSで生成されます -->
    </div>

    <div class="grid-body" id="gridBody">
      <!-- 時刻ラベル列 -->
      <div class="time-labels" id="timeLabels"></div>
      <!-- 7日分のグリッド列がJSで生成されます -->
    </div>
  </div>

  <!-- フッターバー -->
  <div class="footer-bar">
    <div class="selected-summary" id="selectionInfo">
      未選択 (画面をなぞって時間帯を指定)
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-clear" id="clearBtn">選択解除</button>
      <button class="btn-sync" id="submitBtn" disabled>
        <span>Googleカレンダーへ一括登録</span>
      </button>
    </div>
  </div>

  <!-- 件名入力・編集モーダル -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">予定の件名を入力</h3>
        <button class="modal-close-btn" id="modalCloseBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-time-badge" id="modalTimeRange">10/20 (火) 14:00 〜 18:00</div>
        
        <div class="form-group">
          <label for="eventCalSelect">登録先カレンダー:</label>
          <select id="eventCalSelect" class="modal-select">
            <!-- JSで動的生成 -->
          </select>
        </div>

        <div class="form-group">
          <label for="eventTitleInput">件名 / 予定名:</label>
          <input type="text" id="eventTitleInput" placeholder="例: 早番レジ、品出し、MTG" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-danger" id="modalDeleteBtn" style="display:none;">この予定を削除</button>
        <button class="btn-secondary" id="modalCancelBtn">キャンセル</button>
        <button class="btn-primary" id="modalSaveBtn">決定 (Enter)</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
